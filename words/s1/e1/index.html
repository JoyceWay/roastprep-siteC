<script>
const EP={"code": "S01E01B", "season": "Who Fell For It?", "seasonZh": "谁上当了？", "n": 1, "title": "The Kid Who Banned Water", "titleZh": "把水禁掉的男孩", "cards": [{"t": "hook", "en": "There is a chemical inside your body right now.", "kick": "This is its warning.", "zh": "此刻，你的身体里就有一种化学物质。", "kickZh": "这是关于它的警告。", "peek": {"who": "d1", "mood": "shocked", "en": "INSIDE ME?!", "zh": "在我身体里？！"}}, {"t": "flyer", "head": "WARNING", "name": "DIHYDROGEN MONOXIDE", "items": ["Found in acid rain.", "Can cause severe burns.", "Breathing it in kills thousands of people every year."], "zh": "警告：一氧化二氢。酸雨里有它。能造成严重烧伤。每年有成千上万的人因为吸入它而死。", "vote": {"ask": "Fifty ninth graders were asked what to do about it.", "askZh": "有人问了五十个九年级学生：该拿它怎么办？", "call": "Your turn. Tap one.", "callZh": "轮到你了，点一个。", "opts": ["Ban it", "Not sure", "It’s fine"], "optsZh": ["禁掉", "拿不准", "没问题"]}}, {"t": "stat", "en": "It was water.", "zh": "那是水。", "rows": [["43", "said ban it.", "说：禁掉。"], ["6", "were not sure.", "拿不准。"], ["1", "saw through it: water.", "看穿了：那是水。"]], "you": ["You and 43 ninth graders.", "You and 6 ninth graders.", "You and exactly 1 ninth grader."], "youZh": ["你和 43 个九年级学生一样。", "你和 6 个九年级学生一样。", "你和那唯一的 1 个九年级学生一样。"], "peek": {"who": "c2", "mood": "meh", "en": "i drank some this morning 💀", "zh": "我早上刚喝过 💀"}}, {"t": "text", "en": "A 14-year-old named Nathan asked that question in 1997, for a science fair in Idaho Falls.", "kick": "And every line of the warning was true.", "zh": "1997 年，一个叫 Nathan 的 14 岁男孩为爱达荷福尔斯的科学展问了这个问题。", "kickZh": "而警告上的每一行都是真的。"}, {"t": "text", "en": "“Dihydrogen monoxide” is just an [[obscure]] name for water. “Di” means two, “mono” means one: {{H₂O}}.", "zh": "“一氧化二氢”只是水的一个【生僻】名字。di 是“二”，mono 是“一”：两个氢、一个氧，H₂O。"}, {"t": "text", "en": "Water is about as [[innocuous]] as a chemical gets. You drank some today. You are about 60 percent water yourself.", "zh": "水大概是最【无害】的化学品了。你今天就喝过。你自己大约 60% 是水。"}, {"t": "text", "en": "It is also [[ubiquitous]]: in the rain, in your soda, in every single student who wanted it banned.", "zh": "它还【无处不在】：雨里有，汽水里有，每一个想把它禁掉的学生身体里也有。"}, {"t": "point", "en": "The warning never lied. It only [[imply|implied]] danger. The students [[infer|inferred]] the rest. Stay [[skeptical]].", "kick": "His project title: “How Gullible Are We?”", "stamp": "Won first prize", "zh": "那份警告没有撒谎。它只是【暗示】了危险。剩下的是学生们自己【推断】出来的。保持【怀疑】。", "kickZh": "他的课题名叫：《我们有多好骗？》", "stampZh": "一等奖"}], "comments": [{"who": "c2", "mood": "smug", "en": "water is [[ubiquitous]]. it is LITERALLY inside them. and 43 people went “ban it” 💀 FORTY-THREE.", "zh": "水无处不在，他们自己身体里就有。结果 43 个人说“禁了吧”💀 四十三个。"}, {"who": "d1", "mood": "happy", "en": "WOOF!! I DRINK DIHYDROGEN MONOXIDE OUT OF THE TOILET EVERY DAY AND I FEEL AMAZING!!", "zh": "汪！！我每天都从马桶里喝一氧化二氢，感觉好极了！！"}, {"who": "c1", "mood": "meh", "en": "He did not tell one lie. Personally, I stay [[skeptical]] of anything with more syllables than my dinner.", "zh": "他一句谎话都没说。至于我，凡是音节比我的晚饭还多的东西，我一律保持怀疑。"}], "receipts": {"real": [{"en": "Nathan was 14 and went to Eagle Rock Junior High in Idaho Falls, Idaho. His project, “How Gullible Are We?”, won first prize at the Greater Idaho Falls Science Fair in 1997.", "zh": "Nathan 当时 14 岁，在爱达荷州爱达荷福尔斯市的 Eagle Rock 初中上学。他的课题《我们有多好骗？》在 1997 年的大爱达荷福尔斯科学展上拿了一等奖。", "src": [1]}, {"en": "He gave 50 ninth graders the warning and asked what, if anything, should be done. 43 favored a ban, 6 were undecided, and 1 recognized that the chemical was water.", "zh": "他把警告给了 50 个九年级学生，问他们该不该采取什么措施。43 人赞成禁用，6 人拿不准，1 人认出那是水。", "src": [1]}, {"en": "Every claim on the warning card is true of water. It is in acid rain. Steam burns. And “breathing it in” is drowning.", "zh": "警告卡上的每一条对水来说都是真的：酸雨里有水；水蒸气会烫伤人；“吸入”指的就是溺水。", "src": [1, 2]}, {"en": "An adult human body is roughly 60 percent water. Babies are even more.", "zh": "成年人的身体大约 60% 是水，婴儿更多。", "src": [3]}], "context": [{"en": "Nathan did not write the warning. College students in California had been passing the same joke around since about 1990, and it was on a web page by 1994. His idea was to test it on real people and count the results.", "zh": "警告不是 Nathan 写的。加州的大学生从 1990 年前后就在传这个玩笑，1994 年已经有了网页。他的点子是拿它去测真人，并把结果数出来。", "src": [2]}, {"en": "Fact-checkers point out that ninth graders answering together can follow one another, and 50 students is a small group.", "zh": "做事实核查的人提醒：九年级学生一起作答，容易互相跟着选；而且 50 个人是很小的样本。", "src": [1]}], "ours": [{"en": "Some retellings say the students “voted” or “signed a petition.” We follow the version in which he asked them what should be done.", "zh": "有的转述说学生们“投票”或“签了请愿书”。我们采用的版本是：他问他们该怎么办。"}, {"en": "Our opening line plays the same trick as the warning. It is true, because you are about 60 percent water, and it is worded to sound scary.", "zh": "我们的开场白用了和那份警告一样的手法：它是真的（你的身体大约 60% 是水），但措辞故意让人害怕。"}], "sources": [{"id": 1, "title": "Snopes: Is Dihydrogen Monoxide Dangerous?", "url": "https://www.snopes.com/science/dhmo.asp"}, {"id": 2, "title": "Wikipedia: Dihydrogen monoxide parody", "url": "https://en.wikipedia.org/wiki/Dihydrogen_monoxide_parody"}, {"id": 3, "title": "U.S. Geological Survey: The Water in You", "url": "https://www.usgs.gov/special-topics/water-science-school/science/water-you-water-and-human-body"}]}, "words": [{"w": "skeptical", "say": "SKEP-tih-kul", "short": "not convinced yet", "rel": ["≈", "≠", "↔"], "pos": "adj.", "ipa": "/ˈskeptɪkəl/", "en": "Having doubts about whether something is true; wanting good evidence before you believe it.", "zh": "持怀疑态度的；要先看到证据才信", "col": ["skeptical of the claim", "skeptical about the plan", "remain skeptical"], "near": [["doubtful", "Close in meaning, less formal."], ["cynical", "Stronger and more negative: expecting the worst of people."], ["gullible", "Believes things too easily."]], "wild": {"quote": "Astronomers were highly skeptical about the canals…", "zh": "天文学家对那些“运河”非常怀疑……", "by": "NASA", "work": "Mars Exploration Rover Landings press kit", "year": 2004, "kind": "U.S. government", "url": "https://mars.nasa.gov/internal_resources/826/", "seen": "2026-11-18", "note": "People once pictured Mars crisscrossed by canals, maybe built by Martians. Astronomers did not buy it.", "noteZh": "以前很多人想象火星上布满运河，也许还是火星人修的。天文学家不买账。"}, "scene": {"who": "c1", "mood": "meh", "en": "Poppy, when someone says “the vet is fun.”", "zh": "有人说“去看兽医很好玩”时的 Poppy。"}, "checked": {"date": "2026-11-18", "refs": ["https://www.merriam-webster.com/dictionary/skeptical", "https://www.merriam-webster.com/simple/skeptical"]}}, {"w": "obscure", "say": "ub-SKYOOR", "short": "hardly anyone knows it", "rel": ["≈", "≠", "≠"], "pos": "adj.", "ipa": "/əbˈskjʊr/", "en": "Not known to most people; also, hard to understand. (As a verb: to hide something or make it unclear.)", "zh": "鲜为人知的，生僻的；难懂的。（作动词：遮住，使模糊）", "col": ["an obscure reference", "a relatively obscure writer", "obscure the truth"], "near": [["unknown", "Plain word for the first meaning."], ["vague", "Not clear because details are missing."], ["ambiguous", "Could be understood in two ways."]], "wild": {"quote": "…an obscure settlement … grew into a well-known and prosperous American city…", "zh": "……一个没什么人知道的小定居点……发展成了一座著名而繁荣的美国城市……", "by": "National Park Service", "work": "Teaching with Historic Places: The Old Mormon Fort", "kind": "U.S. government", "url": "https://www.nps.gov/subjects/teachingwithhistoricplaces/lessons-by-period.htm", "seen": "2026-11-18", "note": "The city? Las Vegas.", "noteZh": "哪座城市？拉斯维加斯。"}, "scene": {"who": "c2", "mood": "smug", "en": "The one cupboard where the treats are hidden. Nobody else can find it. Mochi can.", "zh": "藏零食的那个柜子。别人都找不到，Mochi 找得到。"}, "checked": {"date": "2026-11-18", "refs": ["https://www.merriam-webster.com/dictionary/obscure", "https://www.merriam-webster.com/simple/obscure"]}}, {"w": "innocuous", "say": "ih-NAH-kyoo-us", "short": "harmless", "rel": ["=", "≈", "≠"], "pos": "adj.", "ipa": "/ɪˈnɑːkjuəs/", "en": "Harmless; not likely to hurt, bother, or offend anyone.", "zh": "无害的；不会伤人或冒犯人的", "col": ["seemingly innocuous", "an innocuous question", "relatively innocuous"], "near": [["harmless", "The plain word. Same meaning."], ["benign", "Gentle or not dangerous; common in medicine."], ["innocent", "Not guilty of doing something wrong. A different word."]], "wild": {"quote": "…it looks a little retro but pretty innocuous.", "zh": "……它看起来有点复古，但挺无害的。", "by": "NASA", "work": "Curious Universe podcast: Monitoring the Air We Breathe", "kind": "U.S. government", "url": "https://www.nasa.gov/podcasts/curious-universe/earth-series-monitoring-the-air-we-breathe/", "seen": "2026-11-18", "note": "A podcast host is describing an old spray can in a scientist’s office. “Retro” means old-fashioned. As long as the can stays closed, it does no harm.", "noteZh": "播客主持人在描述一位科学家办公室里的旧喷雾罐。retro 是“老式的”。只要罐子不打开，它就没有害处。"}, "scene": {"who": "d1", "mood": "shocked", "en": "Buster barking at the vacuum cleaner. It is unplugged.", "zh": "Buster 冲着吸尘器狂叫。吸尘器没插电。"}, "checked": {"date": "2026-11-18", "refs": ["https://www.merriam-webster.com/dictionary/innocuous"], "note": "Second reference: Merriam-Webster Kids Definition on the same page."}}, {"w": "ubiquitous", "say": "yoo-BIK-wuh-tus", "short": "everywhere", "rel": ["≈", "≈", "↔"], "pos": "adj.", "ipa": "/juːˈbɪkwɪtəs/", "en": "Seeming to be everywhere at the same time; very common.", "zh": "无处不在的，随处可见的", "col": ["become ubiquitous", "ubiquitous in modern life", "the ubiquitous smartphone"], "near": [["widespread", "Found over a large area or among many people."], ["common", "The plain word; weaker."], ["rare", "Hardly found anywhere. The opposite."]], "wild": {"quote": "Microplastics are nearly ubiquitous today in the marine environment…", "zh": "如今，微塑料在海洋环境中几乎无处不在……", "by": "NOAA", "work": "How Big Is the Great Pacific Garbage Patch? Science vs. Myth", "year": 2019, "kind": "U.S. government", "url": "https://response.restoration.noaa.gov/about/media/how-big-great-pacific-garbage-patch-science-vs-myth.html", "seen": "2026-11-18", "note": "Microplastics are tiny bits of plastic. “Marine” means in the sea.", "noteZh": "microplastics 是极小的塑料碎片；marine 指“海洋的”。"}, "scene": {"who": "c2", "mood": "happy", "en": "Mochi’s hair. On the couch, on your black hoodie, somehow inside the fridge.", "zh": "Mochi 掉的毛。沙发上有，你的黑卫衣上有，不知怎么冰箱里也有。"}, "checked": {"date": "2026-11-18", "refs": ["https://www.merriam-webster.com/dictionary/ubiquitous"], "note": "Second reference: Oxford Advanced Learner’s Dictionary definition, seen quoted; open the entry directly at the next review."}}, {"w": "infer", "say": "in-FUR", "short": "work it out from clues", "rel": ["≈", "≈", "↔"], "pos": "v.", "ipa": "/ɪnˈfɝː/", "en": "To work out a conclusion from clues and evidence, when nobody has said it directly.", "zh": "推断（根据线索自己得出结论）", "col": ["infer from the evidence", "infer that …", "we can reasonably infer"], "near": [["conclude", "Close in meaning."], ["deduce", "To reason step by step to an answer."], ["imply", "The other side: the speaker implies, the listener infers."]], "misuse": "Careful writers keep the two apart: “Are you implying I did it?” is what the speaker hints. Infer is what the listener works out.", "wild": {"quote": "…paleontologists can infer many characteristics of an extinct animal.", "zh": "……古生物学家可以推断出一种已灭绝动物的许多特征。", "by": "National Park Service", "work": "Hagerman Fossil Beds: What is Paleontology?", "kind": "U.S. government", "url": "https://www.nps.gov/hafo/learn/paleontology.htm", "seen": "2026-11-18", "note": "Nobody watched these animals eat. Scientists work it out by comparing the fossils with animals alive today.", "noteZh": "没人见过这些动物吃东西。科学家把化石和今天活着的动物对比，推出来的。"}, "scene": {"who": "c3", "mood": "shocked", "en": "Luna hears a can opener and concludes: dinner. She has never been wrong.", "zh": "Luna 听见开罐器的声音，得出结论：开饭了。她从来没错过。"}, "checked": {"date": "2026-11-18", "refs": ["https://www.merriam-webster.com/dictionary/infer"], "note": "Merriam-Webster’s usage guide says the two words have overlapped for centuries; we teach the distinction careful writers and the SAT keep."}}, {"w": "imply", "say": "im-PLY", "short": "hint without saying it", "rel": ["≈", "≈", "↔"], "pos": "v.", "ipa": "/ɪmˈplaɪ/", "basic": true, "en": "To suggest something without saying it directly.", "zh": "暗示（不直接说出来）", "col": ["imply that …", "what are you implying?", "the results imply"], "near": [["hint", "Less formal."], ["suggest", "Close in meaning."], ["infer", "The other side: the speaker implies, the listener infers."]], "wild": {"quote": "Probe marks … near bird tracks imply that the birds were using their beaks…", "zh": "鸟脚印旁边……的戳痕暗示，这些鸟当时在用喙……", "by": "National Park Service", "work": "Denali National Park: Trace Fossils", "kind": "U.S. government", "url": "https://www.nps.gov/dena/learn/nature/trace-fossils.htm", "seen": "2026-11-18", "note": "Ancient birds left small holes in the mud beside their footprints. The holes hint at what they were doing: digging for food.", "noteZh": "古代的鸟在脚印旁的泥里留下了小洞。这些洞暗示了它们当时在做什么：挖东西吃。"}, "scene": {"who": "c2", "mood": "meh", "en": "Mochi sitting on your laptop. She has not said “stop working.” She has implied it.", "zh": "Mochi 坐在你的笔记本电脑上。她没说“别工作了”，但她暗示了。"}, "checked": {"date": "2026-11-18", "refs": ["https://www.merriam-webster.com/dictionary/imply"]}}], "boss": {"h": "Boss round", "hZh": "Boss 题", "who": "c1", "mood": "smug", "ctx": "Mochi left an empty treat bag next to Buster’s bed and walked away without a word. Now Buster is in trouble.", "ctxZh": "Mochi 把一个空零食袋放在 Buster 的床边，一句话没说就走了。现在 Buster 有麻烦了。", "line": "Mochi never said Buster ate the treats. She only {_} it by leaving one empty bag.", "lineZh": "Mochi 从没说过零食是 Buster 吃的。她只是留下一个空袋子，（　　）了这一点。", "opts": [{"w": "implied", "d": "hinted at it without saying it", "ok": true}, {"w": "inferred", "d": "worked it out from clues", "ok": false}], "win": "Right. The one giving the hint implies. Everyone who looked at the bag and blamed Buster inferred.", "winZh": "对。给暗示的人是 imply。看见袋子就怪 Buster 的那些人是 infer。", "lose": "Not quite. Inferring is what the audience does with clues. Mochi is the one planting the clue, so she implied it.", "loseZh": "差一点。infer 是看到线索的人做的事。Mochi 是放线索的那个，所以她是 implied。"}, "cop": {"h": "Word Cop", "hZh": "用词警察", "ask": "One of these uses its word wrong. Tap it.", "askZh": "下面有一句把词用错了，点它。", "items": [{"who": "c3", "mood": "meh", "en": "The label listed 14 [[obscure]] ingredients I had never heard of.", "wrong": false, "note": "This one is fine. Ingredients nobody has heard of are obscure: not known to most people.", "noteZh": "这句没问题。没人听说过的配料，正是 obscure：大多数人不知道的。"}, {"who": "d1", "mood": "happy", "en": "SQUIRRELS ARE [[ubiquitous]] IN THIS PARK!! I HAVE SEEN EXACTLY ONE ALL YEAR!!", "wrong": true, "fix": "SQUIRRELS ARE ~ubiquitous~ *rare* IN THIS PARK!! I HAVE SEEN EXACTLY ONE ALL YEAR!!", "note": "Caught it. Ubiquitous means seeming to be everywhere. One squirrel all year is the opposite: rare.", "noteZh": "抓到了。ubiquitous 是“到处都是”。一整年只见过一只，正好相反：rare（稀少）。"}, {"who": "c2", "mood": "smug", "en": "buster says the bath is fun. i remain deeply [[skeptical]].", "wrong": false, "note": "This one is fine. Doubting a claim until you see proof is exactly what skeptical means.", "noteZh": "这句没问题。在看到证据之前先不信，正是 skeptical 的意思。"}]}, "sat": {"h": "Hard Mode", "hZh": "困难模式", "target": "innocuous", "passage": "In 1997, a student showed other students a list of alarming but accurate facts about “dihydrogen monoxide.” Most favored banning it, unaware that the term simply means water. The episode suggests that an unfamiliar name can make a substance seem dangerous even when it is completely {_}.", "passageZh": "1997 年，一个学生给其他学生看了一份关于“一氧化二氢”的清单，上面的事实吓人但准确。多数人赞成禁用，却不知道这个词指的就是水。这件事说明：一个陌生的名字能让一种物质显得危险，即使它完全是（　　）的。", "choices": [{"w": "innocuous", "ok": true, "why": "“Seem dangerous even when” needs the opposite of dangerous: harmless.", "whyZh": "“显得危险，即使……”后面需要“危险”的反面：无害。"}, {"w": "ubiquitous", "ok": false, "why": "Being everywhere is not the opposite of being dangerous, so “even when” has nothing to push against.", "whyZh": "“到处都有”不是“危险”的反面，和“即使”接不上。"}, {"w": "obscure", "ok": false, "why": "An obscure substance could still be dangerous. The sentence needs a word that contrasts with dangerous.", "whyZh": "鲜为人知的东西照样可能危险。这里需要一个和“危险”形成对比的词。"}, {"w": "skeptical", "ok": false, "why": "Skeptical describes people who doubt. A substance cannot be skeptical.", "whyZh": "skeptical 形容的是心存怀疑的人，不能形容一种物质。"}]}, "badge": {"line": "Big scary name. It was water.", "lineZh": "名字很吓人，其实就是水。"}, "sticker": {"name": "Hazmat Buster", "alt": "Buster in a yellow hazmat suit, terrified of a glass of water"}, "next": {"en": "A museum in New York had a strange problem: its visitors would not leave.", "zh": "纽约有一家博物馆遇到一个怪问题：参观的人不肯走。", "ask": "How would you get them out?", "askZh": "换了你，怎么把人请出去？"}, "recap": {"en": "In 1997, a 14-year-old got 43 out of 50 ninth graders to say a dangerous chemical should be banned. It was water.", "zh": "1997 年，一个 14 岁的男孩让 50 个九年级学生里的 43 个说：这种危险的化学品应该禁掉。那是水。"}, "tease": "Would You Ban It?", "teaseZh": "你会禁掉它吗？", "cover": {"file": "art/covers/S01E01.webp", "alt": "Comic: at a school science fair in 1997, a boy in a lab coat, seen from behind, points at yellow warning posters. Four classmates throw up their hands. One reaches to mark a whiteboard that asks SHOULD WE BAN IT?", "src": "data:image/webp;base64,UklGRghRAQBXRUJQVlA4IPxQAQDw5gOdASqEAzICPrVKnkonJCMiLRa94OAWiWRu1Pl9W/eOyj+X+m/4N8wdAdjNXAIf86ed/Es/z+mn55WiPJp/n/0l/3PWL+of7P9P+6xTXp58d/sf/D12sn+wf6H+O/eT2ruVe+z5n+H/b3+L+b7+x/6u3/4v/reZN61/OfN183P+X/7v9t7yP7P/rv/f+f/0Pf1L/Jfsr7t//D+5/vo/xX/j/L34Rf1r/aftd7s//h/cL/w/Hv+t/8v9sf9z8h/9O/uv/t9s31sP7h/6P///9fg0/cb///933kf/d+4/xI/2P/u/uZ7ZH//7PnpD+v3+K/vX43fEn5L+7f6r/D/57/qf4j01/JvrX9D/ff81/0/8t84n3j/pf5/x99U/93/U+p380/Cf77+/f6H/xfFv+Z/7H+R/03kv8i/9P/E/6X3Bfzf+pf63/BfvN/j/Vn/2/97/ne+k4j/c/9v/Z+wL7f/U/+b/jPyx+HX47/q/6L1L/fv8f/3P8p/pvkB/tv9o/5P+F/K76V/6fhF/hf+V+4nwC/z//Bf+7/Te7l/c//j/X/8j1l/pH+z/+3+6+Bv+gf43/yf5nty+k0RcAk93iUgTkpnBkCKbEfGf58d1ZcEHX7ARQTmJIOVnz/6CNOIHRqkAHWD0ct const NAMES={"c1": "Poppy", "c2": "Mochi", "c3": "Luna", "c4": "Boba", "d1": "Buster"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SN=+EP.code.slice(1,3),SP="S"+String(SN).padStart(2,"0")+"E";
const store={get(k,d){try{const v=localStorage.getItem("rps_"+EP.code+"_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("rps_"+EP.code+"_"+k,JSON.stringify(v))}catch(e){}}};
const WORDS={};EP.words.forEach(w=>WORDS[w.w]=w);
function fmt(s){return esc(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,w,d)=>`<button type="button" class="w" data-w="${w}">${d||w}</button>`).replace(/\{\{([^}]+)\}\}/g,"<mark>$1</mark>").replace(/\(\(([^)]+)\)\)/g,'<i class="term">$1</i>').replace(/\{_\}/g,'<span class="blank">&nbsp;</span>').replace(/~([^~]+)~/g,"<s>$1</s>").replace(/\*([^*]+)\*/g,"<em>$1</em>")}
const zhp=s=>s?`<p class="zh">${esc(s).replace(/【([^】]+)】/g,"<b>$1</b>").replace(/\(\(([^)]+)\)\)/g,'<i class="term">$1</i>')}</p>`:"";
const av=(who,mood)=>`<img src="${AV[who+"_"+(mood||"happy")]||AV[who+"_happy"]}" alt="${NAMES[who]}">`;

/* ---------- anonymous stats (off unless a URL is configured) ---------- */
let Q=[],qt=null;
function track(e,p){if(!STATS_URL)return;Q.push(Object.assign({e:e,ep:EP.code},p||{}));if(Q.length>=30)flush();else if(!qt)qt=setTimeout(flush,20000)}
function flush(){clearTimeout(qt);qt=null;if(!Q.length||!STATS_URL)return;const b=JSON.stringify({v:"story",b:Q.splice(0,60)});try{navigator.sendBeacon?navigator.sendBeacon(STATS_URL,b):fetch(STATS_URL,{method:"POST",body:b,keepalive:true})}catch(e){}}
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});addEventListener("pagehide",flush);

/* ---------- screens ---------- */
const S=[];EP.cards.forEach((c,i)=>S.push({k:"story",i:i}));
(EP.fakeoff?["fakeoff"]:[]).concat(["comments","receipts","boss","cop","sat","done"]).forEach(k=>S.push({k:k}));
const NSTORY=EP.cards.length;
let st=store.get("st",{i:0,heart:null,boss:null,cop:null,sat:null,max:0});
let zh=store.get("zh",false);
function save(){store.set("st",st)}

/* A card may carry a vote: {ask?, opts[3], optsZh[3], right?}. On the opening card it is a guess ("call it"), shown as a column.
   The card marked reveal:true then answers the guess: "You called it." or the player's own words back. c.you / c.youZh override a line. */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;let DR={},dT=[],lockT=null;
const CALL=["Your guess? Tap one.","你猜是哪个？点一个。"],GUT=["Go with your gut. Tap one.","凭直觉选一个，点它。"],SAVED=["Saved. The answer comes later.","已记下。答案稍后揭晓。"],PICK='<em class="lk">Your pick</em>';
function voteHtml(c,col){const v=c.vote;if(!v)return "";const ci=EP.cards.indexOf(c),dr=st.vote==null&&!DR[ci]&&!RM;DR[ci]=1;const cl=v.call?[v.call,v.callZh||""]:CALL;const call=st.vote!=null?`<p class="vcall saved">${SAVED[0]}</p><p class="zh vcz">${SAVED[1]}</p>`:`<p class="vcall ${dr?"pop":""}"><span class="vct">${esc(cl[0])}</span> <i aria-hidden="true">↓</i></p><p class="zh vcz">${esc(cl[1])}</p>`;
  return `<div class="vote ${col?"col":""}">${v.ask?`<p class="vq">${esc(v.ask)}</p>${zhp(v.askZh)}`:""}${call}<div class="vbs ${st.vote!=null?"has":""} ${dr?"drama":""}">${v.opts.map((o,i)=>`<button type="button" class="vb ${st.vote===i?"on":""}" data-vote="${i}" aria-pressed="${st.vote===i}">${esc(o)}${zh?`<small>${esc(v.optsZh[i])}</small>`:""}${st.vote===i?PICK:""}</button>`).join("")}</div></div>`}
function youLine(c){const v=EP.cards[0].vote;if(!c.reveal||!v||v.right==null||st.vote==null)return "";const i=st.vote,ok=i===v.right;
  const en=(c.you&&c.you[i])||(ok?"You called it.":`You said “${v.opts[i]}.” Not this time.`),z=(c.youZh&&c.youZh[i])||(ok?"你猜对了。":`你猜的是“${v.optsZh[i]}”。这次没猜中。`);
  const m=/^You said “(.+?)”\s*(.+)$/.exec(en);   /* two parts: what you picked (small), then the verdict or remark (large) */
  return `<p class="youline ${ok?"hit":""}">${m?`<span class="ys">You said “${esc(m[1])}”</span><span class="yr">${esc(m[2])}</span>`:esc(en)}</p>${zhp(z)}`}
const onCover=()=>!!EP.cover&&st.i===0&&!st.go;
function cover(){const rv=EP.cards.findIndex(c=>c.reveal||c.you),open=!EP.tease||st.completed||(rv>=0&&st.max>=rv),t=open?[EP.title,EP.titleZh]:[EP.tease,EP.teaseZh];
  return `<article class="card cover anim"><img class="cvi" src="${EP.cover.src}" alt="${esc(EP.cover.alt||"")}"><div class="cvt"><p class="eyebrow">Season ${SN} · Episode ${EP.n}</p><h1 class="cvh">${esc(t[0])}</h1>${zhp(t[1])}<p class="cvm">A true story · ${NSTORY} cards · ${EP.words.filter(w=>!w.basic).length} SAT words</p></div></article>`}
/* a pet looks over the bottom edge of a story card and reacts: {who, mood, en, zh}. The pets comment on the story; they are never in it. */
function peek(p){return `<div class="peek"><span class="pq">${esc(p.en)}${zh&&p.zh?`<small>${esc(p.zh)}</small>`:""}</span><span class="pw">${av(p.who,p.mood)}</span></div>`}
function fitPeek(){const c=document.querySelector('.card'),pk=c&&c.querySelector('.peek');if(!pk)return;[...pk.children].forEach(e=>e.classList.remove('off'));
  const els=[...c.querySelectorAll('p,li,h1,h2,button,.kick')].filter(e=>!e.closest('.peek')&&e.offsetParent),rs=[];
  els.forEach(e=>{const g=document.createRange();g.selectNodeContents(e);rs.push(...g.getClientRects());if(e.tagName==='BUTTON'||e.classList.contains('kick'))rs.push(e.getBoundingClientRect())});
  const hit=el=>{const b=el.getBoundingClientRect();return rs.some(r=>r.width>1&&r.left<b.right+4&&r.right>b.left-4&&r.top<b.bottom+4&&r.bottom>b.top-4)};
  const q=pk.querySelector('.pq'),f=pk.querySelector('.pw');if(hit(q))q.classList.add('off');if(hit(f)){q.classList.add('off');f.classList.add('off')}}
addEventListener("resize",fitPeek);
function story(c){const h=story0(c);return c.peek?h.replace(/<\/article>$/,peek(c.peek)+"</article>").replace('<article class="card ','<article class="card haspeek '):h}
function story0(c){const tr=tray(c),op="";
  if(c.t==="hook") return `<article class="card hook anim ${c.vote?"hasv":""}"><p class="eyebrow top">Episode ${EP.n} · ${EP.finale?"Season finale":"True story"}</p><p class="big">${fmt(c.en)}</p><p class="kick">${fmt(c.kick)}</p>${zhp(c.zh+" "+c.kickZh)}${voteHtml(c,true)}<p class="eyebrow bot">${EP.words.filter(w=>!w.basic).length} ${EP.finale?"words to review":"SAT words"} · 1 sticker to unlock</p></article>`;
  if(c.t==="flyer") return `<article class="card flyer anim"><p class="eyebrow">⚠ ${esc(c.head)}</p><h2>${esc(c.name)}</h2><ul>${c.items.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul>${zhp(c.zh)}${voteHtml(c)}</article>`;
  if(c.t==="stat") return `<article class="card stat anim${op}"><div class="txt"><p class="big">${fmt(c.en)}</p>${zhp(c.zh)}<ul class="rows">${c.rows.map((r,i)=>`<li class="${c.you&&!c.reveal&&st.vote===i?"me":""}"><b>${esc(r[0])}</b><div><span>${fmt(r[1])}</span>${zhp(r[2])}</div></li>`).join("")}</ul>${c.you&&!c.reveal&&st.vote!=null?`<p class="youline">${esc(c.you[st.vote])}</p>${zhp(c.youZh[st.vote])}`:youLine(c)}</div>${tr}</article>`;
  if(c.t==="point") return `<article class="card point anim${op}"><div class="txt"><p class="big">${fmt(c.en)}</p>${zhp(c.zh)}<p class="kick">${fmt(c.kick)}</p>${zhp(c.kickZh)}${c.stamp?`<span class="stamp">${esc(c.stamp)}</span>`:""}${youLine(c)}</div>${tr}</article>`;
  if(c.t==="idea") return `<article class="card idea anim${op}"><div class="txt"><p class="ie">The idea</p><p class="big"><i class="term">${esc(c.term)}</i></p>${zhp(c.termZh)}<p class="il">${fmt(c.en)}</p>${zhp(c.zh)}<p class="ih">In real life</p><p class="il">${fmt(c.eg)}</p>${zhp(c.egZh)}${c.no?`<p class="ih">Careful</p><p class="il">${fmt(c.no)}</p>${zhp(c.noZh)}`:""}</div>${tr}</article>`;
  return `<article class="card anim${op}"><div class="txt"><p class="big">${fmt(c.en)}</p>${c.kick?"":zhp(c.zh)}${c.kick?`<p class="kick tk">${fmt(c.kick)}</p>${zhp(c.zh+(c.kickZh||""))}`:""}${youLine(c)}</div>${tr}</article>`;
}
/* review words in comments: already taught in the story; a lighter mark, tap for a one-line reminder */
let rv=null;
function rvFmt(t,i){return fmt(t).replace(/class="w" data-w="([^"]+)"/g,(m,w)=>`class="w rv" data-rv="${i}|${w}" aria-expanded="${rv===i+"|"+w}"`)}
function rvHint(i){if(!rv||rv.split("|")[0]!==String(i))return "";const x=WORDS[rv.split("|")[1]];if(!x)return "";
  return `<p class="rvh" role="status"><span><b>${esc(x.w)}</b> <i>=</i> ${esc(x.short||"")}</span><button type="button" class="rvm" data-w="${x.w}">More ＋</button></p>`}
function comments(){
  return `<article class="card sec cmts anim"><h1 class="h">Top comments</h1><p class="zh">热门评论：给你觉得最好笑的一条点 ❤。没有对错。</p>
  <p class="quote">${EP.recap?esc(EP.recap.en).replace(/([^.]+\.)\s*$/,"<b>$1</b>"):esc(EP.cards[0].en)+" <b>"+esc(EP.cards[0].kick)+"</b>"}</p>
  ${EP.comments.map((c,i)=>`<div class="cm">${av(c.who,c.mood)}<div><div class="cmb"><span class="nm">${NAMES[c.who]}</span><p>${rvFmt(c.en,i)}</p>${rvHint(i)}${zhp(c.zh)}</div><button type="button" class="heart" data-heart="${i}" aria-pressed="${st.heart===i}">${st.heart===i?"♥":"♡"} <span>${st.heart===i?"Your pick":"Funniest"}</span></button></div></div>`).join("")}
  <p class="note">${st.heart==null?"Tap ♡ on the one that made you laugh. There is no right answer.":"Saved. Tap it again to undo, or tap another to change."}</p></article>`;
}
function rlist(a){return `<ul>${a.map(x=>`<li>${esc(x.en)}${(x.src||[]).map(n=>`<sup><a href="#src${n}">[${n}]</a></sup>`).join("")}${zhp(x.zh)}</li>`).join("")}</ul>`}
function receipts(){const r=EP.receipts;
  return `<article class="card sec rc anim"><h1 class="h">Receipts</h1><p class="lead">What is real, what is context, and which words are ours.</p><p class="zh">凭据：哪些是真的，哪些是背景，哪些是我们自己的说法。</p>
  ${r.real.length?`<h3>Real</h3>${rlist(r.real)}`:""}${r.context.length?`<h3>Good to know</h3>${rlist(r.context)}`:""}<h3>Our wording</h3>${rlist(r.ours)}
  <h3>Sources</h3><ol>${r.sources.map(s=>`<li id="src${s.id}"><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ol></article>`;
}
/* hints: one small button per option; meanings stay hidden until asked for */
function hinted(q,i){return !!(st.hints&&st.hints[q]&&st.hints[q].indexOf(i)>-1)}
function hintBtn(q,i,w){const on=hinted(q,i);return `<button type="button" class="hi ${on?"on":""}" data-hi="${q}|${i}" aria-pressed="${on}" aria-label="Hint for ${esc(w)}">💡</button>`}
function boss(){const b=EP.boss,a=st.boss;
  return `<article class="card sec anim"><p class="eyebrow">Question 1 of 2</p>${unlockCue()}<h1 class="h">${esc(b.h)}</h1><p class="zh">${esc(b.hZh)}：两个容易混的词，选对的那个。</p>
  <p class="lead">${esc(b.ctx)}</p>${zhp(b.ctxZh)}
  <div class="copm">${av(b.who,b.mood)}<p class="say">${fmt(b.line)}</p></div>${zhp(b.lineZh)}
  <div class="opts">${b.opts.map((o,i)=>{const dn=a&&a.done,h=hinted("boss",i);return `<div class="optrow"><button type="button" class="opt ${dn&&o.ok?"ok":""} ${a&&a.last===i&&!o.ok&&!dn?"no":""}" data-boss="${i}" ${dn?"disabled":""}><b>${esc(o.w)}</b>${dn||h?`<small>${esc(o.d)}</small>`:""}</button>${dn?"":hintBtn("boss",i,o.w)}</div>`}).join("")}</div>
  ${a&&a.done?`<p class="fb ok"><b>✓</b>${esc(b.win)}</p>${zhp(b.winZh)}`:a&&a.last!=null?`<p class="fb no"><b>Try again</b>${esc(b.lose)}</p>${zhp(b.loseZh)}`:""}${a&&a.done?`<button type="button" class="hintb redo" data-redo="boss">↻ Do it again</button>`:""}</article>`;
}
function cop(){const c=EP.cop,a=st.cop,done=!!(a&&a.done),tried=a?(a.tried||[a.last]):[];
  return `<article class="card sec anim"><p class="eyebrow">Question 2 of 2</p>${unlockCue()}<h1 class="h">${esc(c.h)}</h1><p class="lead">${esc(done?"Solved. Here is why each one is right or wrong.":c.ask)}</p><p class="zh">${esc(c.hZh)}：${esc(c.askZh)}</p>
  ${c.items.map((m,i)=>{const picked=tried.indexOf(i)>-1;const body=done&&m.wrong?fmt(m.fix):fmt(m.en).replace(/<button[^>]*>([^<]*)<\/button>/g,"<b>$1</b>");
    const kind=m.wrong?"ok":done?"fine":"no";
    const w=(m.en.match(/\[\[([^\]|]+)/)||[])[1],x=WORDS[w];
    return `<div class="copm">${av(m.who,m.mood)}<div><div class="optrow"><button type="button" class="bub ${done&&m.wrong?"ok":""} ${picked&&!m.wrong&&!done?"no":""}" data-cop="${i}" ${done?"disabled":""}>${body}</button>${done||!x?"":hintBtn("cop",i,w)}</div>${!done&&x&&hinted("cop",i)?`<p class="hl"><b>${esc(w)}</b> <i>=</i> ${esc(x.short||"")}</p>`:""}${done||picked?`<div class="cnote ${kind}"><p>${esc(m.note)}</p>${zhp(m.noteZh)}</div>`:""}</div></div>`}).join("")}${a&&a.done?`<button type="button" class="hintb redo" data-redo="cop">↻ Do it again</button>`:""}</article>`;
}
function sat(){const q=EP.sat,a=st.sat;
  return `<article class="card sec anim"><p class="eyebrow">Optional · SAT-style question</p><h1 class="h">${esc(q.h)}</h1><p class="hm"><b aria-hidden="true">★</b> Bonus: get it right on the first try and your sticker turns shiny.</p><p class="zh">${esc(q.hZh)}（SAT 题型）。选做，可以直接跳过。一次答对，贴纸会变成闪光的。</p>
  <p class="pass">${fmt(q.passage)}</p>${zhp(q.passageZh)}
  <div class="opts">${q.choices.map((o,i)=>`<button type="button" class="opt ${a&&a.done&&o.ok?"ok":""} ${a&&a.tried&&a.tried.indexOf(i)>-1&&!o.ok?"no":""}" data-sat="${i}" ${a&&a.done?"disabled":""}><b>${"ABCD"[i]}. ${esc(o.w)}</b>${a&&(a.done||a.tried.indexOf(i)>-1)?`<small class="why">${esc(o.why)}</small>${zhp(o.whyZh)}`:""}</button>`).join("")}</div>${a&&a.done?`<button type="button" class="hintb redo" data-redo="sat">↻ Do it again</button>`:""}</article>`;
}

function shelf(){const out=[];for(let n=1;n<=12;n++){let got=false;if(n===EP.n)got=!!st.unlocked;else{try{got=!!(JSON.parse(localStorage.getItem("rps_"+SP+String(n).padStart(2,"0")+"_st"))||{}).unlocked}catch(e){}}
  out.push(`<span class="slot ${got?"got":""} ${n===EP.n?"now":""}" aria-label="Episode ${n}: ${got?"sticker unlocked":"locked"}">${THUMB[n]?`<img src="${THUMB[n]}" alt="">`:n}</span>`)}
  return `<div class="shelf">${out.join("")}</div>`}
function done(){const nw=EP.words.filter(w=>!w.basic),left=qLeft(),open=!!st.unlocked;let have=0;shelf().replace(/slot got/g,()=>{have++});
  return `<article class="card sec anim" style="gap:16px"><p class="eyebrow">${EP.finale?"Season "+SN+" complete":"Episode "+EP.n+" complete"}</p>
  <div class="stk ${open?"open":"locked"} ${open&&st.shiny?"shiny":""}">${STICKER?`<img src="${STICKER}" alt="${esc(EP.sticker.alt)}">${open&&st.shiny?`<span class="shine" style="--m:url('${STICKER}')" aria-hidden="true"></span>`:""}`:`<div class="badge"><div><small>${esc(EP.season.toUpperCase())}</small>${esc(EP.badge.line)}</div></div>`}${open?"":`<span class="lock" aria-hidden="true">🔒</span>`}</div>
  <p class="stkcap">${open?`<b>${st.shiny?"Shiny sticker unlocked":"Sticker unlocked"}</b>${esc(EP.sticker.name)}<span class="tl">${esc(EP.badge.line)}</span>`:`<b>Sticker locked</b>${left.length} question${left.length>1?"s":""} left. No rush.`}</p>${zhp(open?(st.shiny?"闪光贴纸已解锁。":"贴纸已解锁。")+EP.badge.lineZh:"贴纸还没解锁：还差 "+left.length+" 道题，随时可以回来做。")}
  ${open?"":`<button type="button" class="hintb" data-goq="1" style="align-self:center">Answer ${left.length>1?"them":"it"} to unlock</button>`}

function fakeoff(){const f=EP.fakeoff,v=st.fo||{},step=v.big==null?0:v.me==null?1:2,key=step?"me":"big",a=f.awards[step?1:0];
  const nom=n=>f.noms.find(x=>x.n===n);
  const picked=(k,i)=>v[k]==null?"":`<p class="fop"><span>${esc(f.awards[i].short)}</span><b>${esc(nom(v[k]).t)}</b><button type="button" class="rvm" data-foc="${k}">Change</button></p>`;
  return `<article class="card sec anim"><h1 class="h">${esc(f.h)}</h1><p class="lead">${esc(f.lead)}</p>${zhp(f.leadZh)}${picked("big",0)}${picked("me",1)}
  ${step<2?`<p class="vq">${esc(a.ask)}</p>${zhp(a.askZh)}<div class="fos">${f.noms.map(m=>`<button type="button" class="fo" data-fo="${key}|${m.n}"><i>${m.n}</i><span><b>${esc(m.t)}</b><small>${esc(m.line)}</small>${zh?`<small>${esc(m.zh)}</small>`:""}</span></button>`).join("")}</div>`
   :`<p class="vq">${esc(f.petsH)}</p>${zhp(f.petsHZh)}${f.pets.map(p=>`<div class="cm">${av(p.who,p.mood)}<div><span class="nm">${NAMES[p.who]} · ${esc(nom(p.pick).t)}</span><p>${fmt(p.en)}</p>${zhp(p.zh)}</div></div>`).join("")}`}
  </article>`}
const R={fakeoff,comments,receipts,boss,cop,sat,done};

function canNext(){const k=S[st.i].k;if(k==="done")return true;return st.i<S.length-1}
function needPick(){const s=S[st.i];return !onCover()&&s.k==="story"&&!!EP.cards[s.i].vote&&st.vote==null}
function label(){const k=S[st.i].k;if(onCover())return "Start";if(needPick())return "Skip";if(k==="story")return st.i===NSTORY-1?(EP.fakeoff?"Cast your vote":"See the comments"):"Next";if(k==="fakeoff")return "See the comments";if(k==="comments")return "See the receipts";if(k==="receipts")return "2 quick questions";
  if(k==="boss")return st.boss&&st.boss.done?"Next question":"Skip for now";if(k==="cop")return st.cop&&st.cop.done?"Continue":"Skip for now";if(k==="sat")return st.sat&&st.sat.done?"Finish":"Skip";return "Play again"}
function armVote(){dT.forEach(clearTimeout);dT=[];const b=document.querySelector(".vbs:not(.has)");if(!b)return;
  const nudge=()=>dT.push(setTimeout(()=>{if(document.contains(b)&&st.vote==null){const c=document.querySelector(".vcall .vct"),z=document.querySelector(".vcz");if(c){c.textContent=GUT[0];c.parentElement.classList.add("gut")}if(z)z.textContent=GUT[1];if(!RM){b.classList.add("nudge");setTimeout(()=>b.classList.remove("nudge"),900)}}},5000));
  if(b.classList.contains("drama"))dT.push(setTimeout(()=>{b.classList.remove("drama");nudge()},2050));else nudge()}
function endDrama(){const b=document.querySelector(".vbs.drama");if(!b)return false;b.classList.remove("drama");armVote();return true}
function render(keep){
  const s=S[st.i],cov=onCover();$("view").innerHTML=cov?cover():s.k==="story"?story(EP.cards[s.i]):R[s.k]();armVote();fitPeek();{const q=QS.indexOf(s.k)>-1,l=q?"Redo this question":"Start this episode over";$("redo").title=l;$("redo").setAttribute("aria-label",l)}
  if(keep)$("view").firstElementChild.classList.remove("anim");
  $("segs").innerHTML=S.map((x,i)=>`<i class="${i<=st.i&&!cov?"on":""} ${i===NSTORY?"cut":""}"></i>`).join("");
  $("ep").textContent="S"+SN+" · E"+EP.n+(cov?"":" · ")+(cov?"":s.k==="story"?(s.i+1)+"/"+NSTORY:{fakeoff:"Vote",comments:"Comments",receipts:"Receipts",boss:"Question 1",cop:"Question 2",sat:"Hard Mode",done:"Done"}[s.k]);
  $("goal").innerHTML=THUMB[EP.n]?`<img src="${THUMB[EP.n]}" alt="">`:"";$("goal").classList.toggle("got",!!st.unlocked);
  $("prev").disabled=st.i===0&&!(EP.cover&&st.go);$("next").disabled=!canNext();$("next").textContent=label();$("next").classList.toggle("ghost",(NEED.indexOf(s.k)>-1&&!(st[s.k]&&st[s.k].done))||needPick());
  $("stage").classList.toggle("zhon",zh);$("zh").setAttribute("aria-pressed",zh);
  $("live").textContent=$("view").innerText.slice(0,300);
  if(st.i>st.max){st.max=st.i;track("reach",{i:st.i})}
  save();
}

function redoQ(k){if(!st[k]){render();return}if(k==="sat")st.satEver=true;st.redone=st.redone||{};st.redone[k]=true;st[k]=null;if(st.hints)delete st.hints[k];if(st.hintUsed)delete st.hintUsed[k];track("redo",{q:k});render()}
function reset(){st={i:0,heart:null,boss:null,cop:null,sat:null,max:st.max,completed:st.completed,seen:st.seen,unlocked:st.unlocked,shiny:st.shiny,satEver:st.satEver||!!st.sat};render()}
function go(d){rv=null;if(lockT){clearTimeout(lockT);lockT=null}if(d>0&&onCover()){st.go=true;track("start");render();return}if(d<0&&st.i===0&&EP.cover&&st.go){st.go=false;render();return}if(d>0&&S[st.i].k==="done"){reset();return}const n=st.i+d;if(n<0||n>=S.length)return;if(d>0&&!canNext())return;const k0=S[st.i].k;if(d>0&&NEED.indexOf(k0)>-1&&!(st[k0]&&st[k0].done))track("skip",{q:k0});st.i=n;if(S[n].k==="done"&&!st.completed){st.completed=true;track("complete")}render()}

function inStory(w){for(const c of EP.cards){const parts=[c.en||"",c.kick||""].concat((c.rows||[]).map(r=>r[0]+" "+r[1]));for(const t of parts){if(t.indexOf("[["+w+"]]")>-1||t.indexOf("[["+w+"|")>-1)return esc(t).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,x,d)=>x===w?"<b>"+(d||x)+"</b>":(d||x)).replace(/\{\{|\}\}/g,"")}}return ""}
function hi(phrase,w){const stem=w.slice(0,Math.max(4,w.length-1));return esc(phrase).replace(new RegExp("("+stem+"[a-z]*)","i"),"<b>$1</b>")}
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function details(x,opt){const quote=opt.story?inStory(x.w):"";
  return `<div><p class="def">${esc(x.en)}</p>${zhp(x.zh)}</div>
    <div><h3>Picture it</h3><div class="scene">${av(x.scene.who,x.scene.mood)}<div><p>${esc(x.scene.en)}</p>${zhp(x.scene.zh)}</div></div></div>
    ${quote?`<div><h3>In the story</h3><p class="instory">${quote}</p></div>`:""}
    <details class="deep"><summary>Go deeper${zh?" · 更多用法":""}</summary><div class="deepin">
    ${x.wild?`<div><h3>Spotted in the wild</h3><figure class="wild"><blockquote>“${hi(x.wild.quote,x.w)}”</blockquote>${zhp(x.wild.zh)}
      <p class="gloss">${esc(x.wild.note)}</p>${zhp(x.wild.noteZh)}
      <figcaption><a href="${x.wild.url}" target="_blank" rel="noopener" title="${esc(x.wild.work)}" aria-label="Source: ${esc(x.wild.by)}, ${esc(x.wild.work)}${x.wild.year?", "+x.wild.year:""}. Opens in a new tab.">— ${esc(x.wild.by)}${x.wild.year?", "+x.wild.year:""} <span aria-hidden="true">↗</span></a></figcaption></figure></div>`:""}
    <div><h3>Say it like this</h3><div class="cols">${x.col.map(c=>`<span>${hi(c,x.w)}</span>`).join("")}</div></div>
    <div><h3>Same or different?</h3><ul class="near">${x.near.map((n,i)=>{const r=(x.rel||[])[i]||"≈";return `<li class="${REL[r][0]}"><span class="rel ${REL[r][0]}" title="${REL[r][1]}">${r}</span><div><b>${esc(n[0])}</b><small>${esc(n[1])}</small></div></li>`}).join("")}</ul>
      <p class="key"><span class="sm">= same</span><span class="ap">≈ close</span><span class="ne">≠ different</span><span>↔ opposite side</span></p></div>
    ${x.misuse?`<div class="watch"><h3>Watch out</h3><p class="def" style="font-size:15.5px">${esc(x.misuse)}</p></div>`:""}</div></details>`}
function markSeen(w){st.seen=st.seen||[];if(st.seen.indexOf(w)<0){st.seen.push(w);track("word",{w:w})}}
const spkBtn=w=>"speechSynthesis" in window?`<button type="button" class="spk" data-say="${w}" aria-label="Hear it">🔊</button>`:"";
/* inline tray under a story card */
function cardWords(c){const t=[c.en||"",c.kick||""].concat((c.rows||[]).map(r=>r[1])).join(" "),out=[];t.replace(/\[\[([^\]|]+)/g,(m,w)=>{if(WORDS[w]&&out.indexOf(w)<0)out.push(w)});return out}
function tray(c){const ws=cardWords(c);if(!ws.length)return "";
  return `<div class="tray">${ws.map(w=>{const x=WORDS[w];return `<div class="tg"><button type="button" class="trow" data-tw="${w}" aria-haspopup="dialog"><b>${esc(w)}</b><span class="teq"><i>=</i> ${esc(x.short||"")}</span><span class="more" aria-hidden="true">＋</span><span class="sr">More about this word</span></button></div>`}).join("")}</div>`}
/* word sheet: opens from the row under a story sentence, from the word itself, and from the review list */
function openWord(w){const x=WORDS[w];if(!x)return;lastFocus=document.activeElement;markSeen(w);save();
  $("sheet").innerHTML=`<div class="sh-head"><button type="button" class="x" id="sh-x" aria-label="Close">✕</button>
    <h2 id="sh-w">${esc(x.w)}${spkBtn(x.w)}${x.basic?'<span class="tag">companion word</span>':""}</h2>
    <p class="pi"><b>${esc(x.say||"")}</b> · ${esc(x.pos)} · ${esc(x.ipa)}</p>
    <span class="eq"><i>=</i> ${esc(x.short||"")}</span></div>
  <div class="sh-body">${details(x,{story:true})}<button type="button" class="gotit" id="sh-ok">Got it</button></div>`;
  const dp=$("sheet").querySelector("details.deep");if(dp)dp.addEventListener("toggle",()=>{if(dp.open)track("deep",{w:w})});
  clearTimeout(hideT);$("sheet").hidden=false;$("sheet").scrollTop=0;requestAnimationFrame(()=>{$("sheet").classList.add("on");$("scrim").classList.add("on");$("sh-x").focus()});
}
function closeWord(){if($("sheet").hidden)return;$("sheet").classList.remove("on");$("scrim").classList.remove("on");hideT=setTimeout(()=>{$("sheet").hidden=true},230);if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");
  if(!t&&e.target.closest(".card")&&endDrama())return;
  if(t){
    if(t.id==="sh-x"||t.id==="sh-ok"){closeWord();return}
    if(t.dataset.say){speak(t.dataset.say);return}
    if(t.dataset.rv){rv=rv===t.dataset.rv?null:t.dataset.rv;if(rv)track("review",{w:rv.split("|")[1]});render(true);return}
    if(t.dataset.jump){const n=S.findIndex(x=>x.k===t.dataset.jump);if(n>-1){rv=null;st.i=n;render()}return}
    if(t.dataset.redo){redoQ(t.dataset.redo);return}
    if(t.dataset.goq){const k=qLeft()[0];if(k){st.i=S.findIndex(x=>x.k===k);render()}return}
    if(t.dataset.fo){const p=t.dataset.fo.split("|");st.fo=st.fo||{};st.fo[p[0]]=+p[1];track("fakeoff",{a:p[0],n:+p[1]});render(true);$("view").firstElementChild.scrollTop=0;return}
    if(t.dataset.foc){if(st.fo)st.fo[t.dataset.foc]=null;render(true);return}
    if(t.dataset.vote!=null){if(lockT)return;st.vote=+t.dataset.vote;track("vote",{i:st.vote});dT.forEach(clearTimeout);const b=t.parentElement;b.classList.remove("drama","nudge");b.classList.add("has");b.querySelectorAll(".vb").forEach(x=>{x.classList.remove("on","lock");x.setAttribute("aria-pressed","false");const l=x.querySelector(".lk");if(l)l.remove()});t.classList.add("on","lock");t.setAttribute("aria-pressed","true");t.insertAdjacentHTML("beforeend",PICK);{const c=document.querySelector(".vcall"),z=document.querySelector(".vcz");if(c){c.className="vcall saved";c.textContent=SAVED[0]}if(z)z.textContent=SAVED[1]}$("next").textContent=label();$("next").classList.remove("ghost");lockT=setTimeout(()=>{lockT=null;go(1)},1100);return}
    if(t.dataset.hi){const p=t.dataset.hi.split("|"),q=p[0],i=+p[1];st.hints=st.hints||{};const l=st.hints[q]=st.hints[q]||[],at=l.indexOf(i);if(at>-1)l.splice(at,1);else{l.push(i);st.hintUsed=st.hintUsed||{};st.hintUsed[q]=true;track("hint",{q:q,i:i})}render(true);return}
    if(t.dataset.tw){openWord(t.dataset.tw);return}
    if(t.dataset.w){openWord(t.dataset.w);return}
    if(t.id==="next"){go(1);return} if(t.id==="prev"){go(-1);return}
    if(t.id==="zh"){zh=!zh;store.set("zh",zh);render(true);return}
    if(t.id==="redo"){const k=S[st.i].k;if(QS.indexOf(k)>-1)redoQ(k);else reset();return}
    if(t.dataset.heart!=null){const h=+t.dataset.heart;if(st.heart===h){st.heart=null;track("unheart",{i:h})}else{st.heart=h;track("heart",{i:h})}render(true);return}
    if(t.dataset.boss!=null){const i=+t.dataset.boss,ok=EP.boss.opts[i].ok;if(!st.boss){st.boss={first:ok,hint:!!(st.hintUsed&&st.hintUsed.boss)};track("boss",{first:ok?1:0,hint:st.boss.hint?1:0})}st.boss.last=i;if(ok){st.boss.done=true;st.boss.hint=!!(st.hintUsed&&st.hintUsed.boss);checkUnlock()}render(true);return}
    if(t.dataset.cop!=null){const i=+t.dataset.cop,ok=EP.cop.items[i].wrong;if(!st.cop){st.cop={first:ok,hint:!!(st.hintUsed&&st.hintUsed.cop),tried:[]};track("cop",{first:ok?1:0,hint:st.cop.hint?1:0})}st.cop.tried=st.cop.tried||[];if(st.cop.tried.indexOf(i)<0)st.cop.tried.push(i);st.cop.last=i;if(ok){st.cop.done=true;st.cop.hint=!!(st.hintUsed&&st.hintUsed.cop);checkUnlock()}render(true);return}
    if(t.dataset.sat!=null){const i=+t.dataset.sat,ok=EP.sat.choices[i].ok;if(!st.sat){const firstEver=!st.satEver;st.sat={first:ok&&firstEver,tried:[]};st.satEver=true;if(ok&&firstEver)st.shiny=true;track("sat",{first:ok&&firstEver?1:0})}if(st.sat.tried.indexOf(i)<0)st.sat.tried.push(i);if(ok)st.sat.done=true;render(true);return}
    return;
  }
  if(e.target.id==="scrim"){closeWord();return}
  const card=e.target.closest(".card");
  if(e.target.closest(".tray"))return;
  if(card&&S[st.i].k==="story"&&$("sheet").hidden){const r=card.getBoundingClientRect();go(e.clientX-r.left<r.width*.3?-1:1)}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeWord();return}
  if(!$("sheet").hidden)return;
  const inBtn=e.target.closest&&e.target.closest("button,a");
  if(e.key==="ArrowRight"){go(1)}else if(e.key==="ArrowLeft"){go(-1)}else if((e.key===" "||e.key==="Enter")&&!inBtn){e.preventDefault();go(1)}
});
let tx=null,ty=null;
$("view").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("view").addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5&&S[st.i].k==="story"&&$("sheet").hidden){e.preventDefault();go(dx<0?1:-1)}});
if(st.i>=S.length)st.i=0;
if(!store.get("started",false)){store.set("started",true);track("start")}
render();
</script>
</body></html>
